# Decap CMS (formerly Netlify CMS)
# Edit content at /admin — changes commit to your repo.
# Set backend.repo to your GitHub repo (e.g. owner/repo) and enable Git Gateway or GitHub backend.

backend:
  name: github
  repo: owner/repo   # Replace with your GitHub user/repo
  branch: main
  base_url: https://your-site.netlify.app  # For OAuth (e.g. Netlify deploy URL)

# Uncomment for local testing (run: npx decap-server)
# local_backend: true

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: blog
    label: Blog
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime }
      - { label: Excerpt, name: excerpt, widget: text }
      - { label: Category, name: category, widget: string }
      - { label: Body, name: body, widget: markdown }

  - name: events
    label: Events
    folder: "src/content/events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime }
      - { label: Time, name: time, widget: string, required: false }
      - { label: Venue, name: venue, widget: string }
      - { label: Location, name: location, widget: string }
      - { label: URL, name: url, widget: string, required: false }
      - { label: Note, name: note, widget: string, required: false }

  - name: personas
    label: Portfolio personas
    folder: "src/content/personas"
    create: false
    files:
      - label: Visual Artist
        name: visual-artist
        file: "src/content/personas/visual-artist.md"
        fields:
          - { label: Label, name: label, widget: string }
          - { label: Name, name: title, widget: string }
          - { label: Statement, name: statement, widget: text }
          - { label: Location, name: location, widget: string }
          - { label: Focus, name: focus, widget: string }
          - { label: Format, name: format, widget: string }
          - { label: Notes, name: notes, widget: list, fields: [{ label: Note, name: value, widget: string }] }
      - label: Dancer
        name: dancer
        file: "src/content/personas/dancer.md"
        fields:
          - { label: Label, name: label, widget: string }
          - { label: Name, name: title, widget: string }
          - { label: Statement, name: statement, widget: text }
          - { label: Location, name: location, widget: string }
          - { label: Focus, name: focus, widget: string }
          - { label: Format, name: format, widget: string }
          - { label: Notes, name: notes, widget: list, fields: [{ label: Note, name: value, widget: string }] }
      - label: Writer
        name: writer
        file: "src/content/personas/writer.md"
        fields:
          - { label: Label, name: label, widget: string }
          - { label: Name, name: title, widget: string }
          - { label: Statement, name: statement, widget: text }
          - { label: Location, name: location, widget: string }
          - { label: Focus, name: focus, widget: string }
          - { label: Format, name: format, widget: string }
          - { label: Notes, name: notes, widget: list, fields: [{ label: Note, name: value, widget: string }] }
          - label: Excerpts
            name: excerpts
            widget: list
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Publication, name: publication, widget: string }
              - { label: Text, name: text, widget: text }
